tags:
  - Auth
summary: Şifre sıfırlama maili gönder
operationId: sendResetEmail
description: 'Kullanıcının e-posta adresine şifre sıfırlama linki gönderir.'
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            type: string
            format: email
            example: john@example.com
responses:
  '200':
    description: E-posta başarıyla gönderildi
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email has been successfully sent.
  '404':
    description: Kullanıcı bulunamadı
  '500':
    description: E-posta gönderilemedi
