tags:
  - Contacts
summary: Kişiyi güncelle
operationId: updateContact
description: 'Var olan bir kişinin bilgilerini günceller. Fotoğraf değiştirilebilir.'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    schema:
      type: string
    required: true
    description: Güncellenecek kişinin ID'si
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
          phoneNumber:
            type: string
          email:
            type: string
          isFavourite:
            type: boolean
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Kişi başarıyla güncellendi
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              properties:
                _id:
                  type: string
                name:
                  type: string
  '404':
    description: Kişi bulunamadı
